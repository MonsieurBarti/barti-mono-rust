[workspace]
resolver = "3"
members = ["crates/kernel", "crates/cells/*/*", "crates/app"]
default-members = ["crates/app"]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"

[workspace.dependencies]
time = "0.3.55"
kernel = { path = "crates/kernel" }
loads = { path = "crates/cells/freight/loads" }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.26.1", features = ["v7"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "sqlx-toml", "tls-none"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
tracing-opentelemetry = "0.33.0"
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }

