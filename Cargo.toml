[workspace]
resolver = "3"
members = ["crates/kernel", "crates/cells/*/*", "crates/app"]
default-members = ["crates/app"]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"

[workspace.lints.rust]
unreachable_pub = "deny"

[workspace.dependencies]
time = "0.3.55"
kernel = { path = "crates/kernel" }
loads = { path = "crates/cells/freight/loads" }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["catch-panic"] }
uuid = { version = "1.26.1", features = ["v7"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_path_to_error = "0.1.20"
garde = { version = "0.23.0", features = ["derive"] }
serde_json = "1.0.151"
sea-orm = { version = "2.0.2", default-features = false, features = ["macros", "sqlx-postgres", "runtime-tokio", "with-uuid", "with-time"] }
sea-orm-migration = { version = "2.0.2", default-features = false, features = ["sqlx-postgres", "runtime-tokio"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
tracing-opentelemetry = "0.33.0"
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-client"] }
utoipa = "5.5.0"
utoipa-axum = "0.2.0"

