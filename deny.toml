[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "utoipa-axum 0.2.0 depends on unmaintained paste; drop when the pin bumps to pastey" },
]

[bans]
# Cell → app is a cargo error: app is bin-only, no lib target.
# New cell: add `{ crate = "<name>", wrappers = ["app"], reason = "hive: only composition root depends on cells" }`.
deny = [
    { crate = "loads", wrappers = ["app"], reason = "hive: only composition root depends on cells" },
    { crate = "tracing", wrappers = ["app", "axum", "axum-core", "hyper-util", "opentelemetry", "sea-orm", "sea-orm-migration", "sqlx-core", "sqlx-postgres", "tower", "tower-http", "tracing-opentelemetry", "tracing-subscriber"], reason = "hive: cells import none of tracing or OpenTelemetry" },
    { crate = "tracing-subscriber", wrappers = ["app", "sea-orm-migration", "tracing-opentelemetry"], reason = "hive: cells import none of tracing or OpenTelemetry" },
    { crate = "tracing-opentelemetry", wrappers = ["app"], reason = "hive: cells import none of tracing or OpenTelemetry" },
    { crate = "opentelemetry", wrappers = ["app", "opentelemetry-http", "opentelemetry-otlp", "opentelemetry-proto", "opentelemetry_sdk", "tracing-opentelemetry"], reason = "hive: cells import none of tracing or OpenTelemetry" },
    { crate = "opentelemetry_sdk", wrappers = ["app", "opentelemetry-otlp", "opentelemetry-proto"], reason = "hive: cells import none of tracing or OpenTelemetry" },
    { crate = "opentelemetry-otlp", wrappers = ["app"], reason = "hive: cells import none of tracing or OpenTelemetry" },
]
