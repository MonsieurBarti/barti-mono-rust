[profile.default]
default-filter = "not (test(/::integration::/) or kind(test))"

# Every Postgres lane joins group `db` under any profile; the slot picks the worker database.
[[profile.default.overrides]]
filter = "test(/::integration::/) or kind(test)"
test-group = "db"

[profile.db]
default-filter = "test(/::integration::/) or kind(test)"

[test-groups]
db = { max-threads = 4 }
